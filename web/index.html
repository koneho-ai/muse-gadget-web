<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muse Gadget (Web)</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <span id="dot" class="dot boot"></span>
    <span id="title">Muse Gadget</span>
    <span id="link-state" class="link-state">starting</span>
  </header>

  <main id="stage">
    <div id="scene">
      <span class="sparkle s1"></span>
      <span class="sparkle s2"></span>
      <span class="sparkle s3"></span>
      <div id="rug"></div>

      <div id="koneho" aria-hidden="true">
        <svg viewBox="0 0 300 360" role="img" aria-label="Koneho">
          <!-- ears -->
          <g class="ear ear-left">
            <ellipse cx="104" cy="74" rx="25" ry="60" fill="#aeb6bf"/>
            <ellipse cx="104" cy="80" rx="12" ry="38" fill="#eec9bd"/>
          </g>
          <g class="ear ear-right">
            <ellipse cx="196" cy="74" rx="25" ry="60" fill="#aeb6bf"/>
            <ellipse cx="196" cy="80" rx="12" ry="38" fill="#eec9bd"/>
          </g>
          <!-- body -->
          <g class="body">
            <ellipse cx="72" cy="292" rx="14" ry="24" fill="#a7b0b9" transform="rotate(24 72 292)"/>
            <ellipse cx="228" cy="292" rx="14" ry="24" fill="#a7b0b9" transform="rotate(-24 228 292)"/>
            <ellipse cx="150" cy="318" rx="72" ry="46" fill="#aeb6bf"/>
            <ellipse cx="150" cy="326" rx="42" ry="30" fill="#f4ecdc"/>
            <ellipse cx="88" cy="350" rx="20" ry="11" fill="#f4ecdc"/>
            <ellipse cx="212" cy="350" rx="20" ry="11" fill="#f4ecdc"/>
          </g>
          <!-- head -->
          <g class="head">
            <ellipse cx="150" cy="190" rx="100" ry="84" fill="#bcc3cb"/>
            <ellipse cx="93" cy="216" rx="22" ry="13" fill="#ccd2d9" opacity=".55"/>
            <ellipse cx="207" cy="216" rx="22" ry="13" fill="#ccd2d9" opacity=".55"/>
            <ellipse cx="150" cy="222" rx="54" ry="36" fill="#f4ecdc"/>
            <g class="eye eye-left">
              <circle cx="110" cy="178" r="11.5" fill="#3a2e24"/>
              <circle cx="114" cy="173" r="3.6" fill="#fff"/>
            </g>
            <g class="eye eye-right">
              <circle cx="190" cy="178" r="11.5" fill="#3a2e24"/>
              <circle cx="194" cy="173" r="3.6" fill="#fff"/>
            </g>
            <path d="M150 203 c-8-6-20-2-20 5 c0 8 10 13 20 15 c10-2 20-7 20-15 c0-7-12-11-20-5" fill="#6b4a33"/>
            <line x1="150" y1="220" x2="150" y2="228" stroke="#6b4a33" stroke-width="2.5" stroke-linecap="round"/>
            <path class="mouth-closed" d="M150 228 q-7 9-17 5 M150 228 q7 9 17 5" fill="none" stroke="#6b4a33" stroke-width="2.5" stroke-linecap="round"/>
            <g class="mouth-open">
              <ellipse cx="150" cy="237" rx="9" ry="0" fill="#7a4436"/>
              <ellipse cx="150" cy="241" rx="5.5" ry="0" fill="#c97b6d" id="tongue"/>
            </g>
          </g>
          <text class="zzz" x="238" y="120" font-size="26" fill="#9fb4c8" opacity="0">z</text>
          <text class="zzz z2" x="256" y="96" font-size="19" fill="#9fb4c8" opacity="0">z</text>
        </svg>
      </div>

      <figure id="frame" hidden>
        <img id="stage-image" alt="Image sent to this gadget">
        <button id="frame-close" title="Back to Koneho">✕</button>
      </figure>
    </div>

    <div id="status" class="status"></div>
    <div id="wave" hidden><span></span><span></span><span></span><span></span><span></span></div>
    <div id="bubble" hidden><div id="reply" class="reply"></div></div>
  </main>

  <footer>
    <form id="ask-form">
      <input id="ask-input" type="text" placeholder="Ask Muse…" autocomplete="off">
      <button type="submit" id="ask-button">Ask</button>
    </form>
    <button id="mic" title="Click to talk, click again to send">🎤</button>
    <label class="volume">🔊 <input id="volume" type="range" min="0" max="100" value="80"></label>
    <button id="sound-hint" hidden>Tap to enable sound</button>
  </footer>

  <audio id="player" preload="auto"></audio>
  <script src="/static/app.js"></script>
</body>
</html>
